name: iOS Simulator Build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios-simulator:
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Build iOS Simulator app
        run: >-
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme App
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/LifeOSDerivedData"
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Upload iOS Simulator app
        uses: actions/upload-artifact@v4
        with:
          name: LifeOS-iOS-Simulator
          path: ${{ runner.temp }}/LifeOSDerivedData/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
